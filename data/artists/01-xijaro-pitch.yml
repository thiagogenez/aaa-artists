genre: Uplifting Trance
tagline: Melodic trance, built for big rooms
bio: >-
  XiJaro & Pitch are the trance duo of Xander van Dommelen and Anthony Reyers, working together
  since 2014. Their emotionally charged, uplifting tracks have come out on Black Hole Recordings,
  FSOE and Who's Afraid Of 138, and they have played Tomorrowland, Transmission, A State Of Trance
  and EDC Las Vegas. They also run Chasing Dreams, a podcast, livestream and label in one.
