tagline: 'Brazil-born, based in Germany: trance meets techno'
bio: >-
  Thiago Genez is a Brazil-born DJ, now based in Germany, and a London Sound Academy graduate who
  started in electronic music in 2018. What began as a side project turned into regular slots across
  London venues. His sets move between progressive and uplifting trance and the harder edge of
  melodic and hard techno. He has played Ministry of Sound, EGG LDN and Peckham Audio, and submitted
  a contest mix for Tomorrowland 2025.
