bio: >-
  DIM3NSION stands as a leading figure in the Spanish trance scene and one of the most influential
  artists from Spain. A protege of Ferry Corsten, he reached a career defining milestone with
  'Dopamina', becoming the only artist outside Gouryella featured on the 'From The Heavens' album,
  while his breakthrough record 'Origami' helped spark renewed interest among top artists in
  reviving classic trance aliases.

  Founder of Bemind Records, DIM3NSION continues to expand his global presence with performances
  at festivals like Untold and Luminosity, alongside a growing international reach following his
  debut in Asia last year. With a versatile and forward-thinking approach, he consistently delivers
  high-impact releases and performances, positioning himself among the leading artists of the new
  generation.
