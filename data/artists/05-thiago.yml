tagline: 'Brazil-born, based in Germany: trance meets techno'
bio: >-
  Born in Brazil and currently based in Stuttgart, Germany, Thiago Genez is an electronic music DJ
  whose performances span Progressive and Uplifting Trance, Melodic Techno, Peak-Time Techno and
  harder electronic sounds. Since starting his musical journey in 2018, he has taken his energetic
  and melodic approach to dancefloors across Europe, performing at renowned venues including
  Ministry of Sound, EGG London and Basing House, as well as making his debut at Amsterdam Dance
  Event in 2025.

  Thiago has supported and shared lineups with established names in the trance scene, including
  Allen Watts, Doppenberg, Jorn van Deynhoven and Ruben de Ronde, continuing to build his presence
  across the European club circuit.
