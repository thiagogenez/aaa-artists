bio: >-
  Krevix is a Dutch DJ and producer from Groningen, known for the experimental edge he brings to
  trance and dance music. His track Your Life stood out, he has collaborated with Ahmed Helmy and
  B Jones, and his music has picked up support from Armin van Buuren, David Guetta, Robin Schulz,
  Dimitri Vegas & Like Mike and Andrew Rayel. He makes his Tomorrowland debut in 2026.
