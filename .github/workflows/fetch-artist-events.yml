name: Fetch artist events

# Proposes upcoming gigs for the roster from external ticketing APIs and opens a
# DRAFT pull request for review. It never merges and never deploys: merging the
# PR follows the normal staging-first flow, and production still requires the
# manual "Deploy production" dispatch.
#
# This is the only workflow with write access, and it is scoped to creating a
# branch and a pull request. Everything else stays read-only.

on:
  schedule:
    # Mon/Wed/Fri 02:37 UTC — clear of the 01:11 date-rollover rebuild, and off
    # the congested :00/:30 marks GitHub advises avoiding.
    - cron: "37 2 * * 1,3,5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: artist-events-proposal
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch and propose gigs
        id: propose
        env:
          SKIDDLE_API_KEY: ${{ secrets.SKIDDLE_API_KEY }}
          BANDSINTOWN_APP_ID: ${{ secrets.BANDSINTOWN_APP_ID }}
        run: node scripts/fetch-artist-events.mjs --write --pr-body proposal.md

      # The proposal is worthless if it does not satisfy the same rules a human
      # edit must, so validate before asking anyone to review it.
      - name: Validate the proposed artist data
        if: steps.propose.outputs.proposed != '0'
        run: npm run check

      - name: Open a draft pull request
        if: steps.propose.outputs.proposed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSED: ${{ steps.propose.outputs.proposed }}
        run: |
          set -euo pipefail
          branch="bot/artist-events-$(date -u +%Y-%m-%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/artists
          git commit -m "data: propose ${PROPOSED} upcoming gig(s) from event sources"
          git push --set-upstream origin "$branch"
          gh pr create \
            --draft \
            --base main \
            --head "$branch" \
            --title "Proposed artist events (${PROPOSED} gig(s))" \
            --body-file proposal.md

      - name: Report when nothing changed
        if: steps.propose.outputs.proposed == '0'
        run: echo "::notice::No new gigs found; no pull request opened."
