name: Checks

# Reusable verification suite. Called by CI for every pull request and push to
# main, and re-run by the production deployment workflow so no commit can reach
# production without passing these exact jobs in the same run.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate artist and event data
        run: npm run check
      - name: Run Worker tests
        run: npm test
      - name: Lint source
        run: npm run lint
      - name: Audit production dependencies
        run: npm run check:dependencies
      - name: Validate production build requirements
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: npm run check:production-env

  browser:
    runs-on: ubuntu-24.04
    container:
      # Keep fonts and browser rendering identical to the committed Linux baseline.
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
      options: --ipc=host
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build test export
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: test-site-key
        run: npm run build
      - name: Validate Cloudflare deployment bundle
        run: npm run check:deploy
      - name: Run browser tests
        run: npm run test:e2e:run
