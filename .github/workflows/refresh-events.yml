name: Refresh event dates

# The static event split and structured data need a fresh build as dates pass.
# Staging is refreshed unconditionally. Production is refreshed only when main
# is the same commit already live in production — a date-only rebuild of code
# that was already released. If main is ahead, production is skipped: new code
# reaches production only through a manual "Deploy production" dispatch.

on:
  schedule:
    # 01:11 UTC — AAA o'clock (A is the 1st letter: 1-1-1). Early morning across
    # Europe (02:11 London / 03:11 Amsterdam in summer), shortly after the UTC
    # date change so yesterday's events drop off the artist pages promptly, and off the
    # congested :00/:30 marks GitHub advises avoiding for schedules.
    - cron: "11 1 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-event-refresh
  cancel-in-progress: false

jobs:
  refresh-staging:
    if: vars.DEPLOYMENT_AUTHORITY == 'github'
    permissions:
      contents: read
      deployments: write
    secrets: inherit
    uses: ./.github/workflows/deploy-staging.yml

  production-guard:
    if: vars.DEPLOYMENT_AUTHORITY == 'github'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
    permissions:
      contents: read
    outputs:
      refresh: ${{ steps.compare.outputs.refresh }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Compare main with the live production commit
        id: compare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-production-refresh.mjs

  refresh-production:
    needs: [production-guard]
    if: needs.production-guard.outputs.refresh == 'true'
    permissions:
      contents: read
      deployments: write
    secrets: inherit
    uses: ./.github/workflows/deploy-production.yml
