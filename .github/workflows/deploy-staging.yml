name: Deploy staging

# Deploys the aaa-artists-staging Worker and static assets to its workers.dev
# origin. Staging uses the same upload, candidate smoke, propagation wait, and
# promotion sequence as production, but every command is pinned to the staging
# environment and Worker. It never touches production or the custom domains.

on:
  workflow_call:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Job-level so it still serializes when this workflow is called from CI and
    # the scheduled refresh (workflow-level concurrency is ignored in called
    # reusable workflows).
    concurrency:
      group: staging-worker-deployment
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ steps.candidate.outputs.staging_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify staging configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing staging CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing staging CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" || { echo "::error::Missing staging NEXT_PUBLIC_TURNSTILE_SITE_KEY"; exit 1; }
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate artist and event data
        run: npm run check
      - name: Build staging export
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build:production
      - name: Validate staging deployment bundle
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run check:deploy:staging
      - name: Record current staging version
        id: previous
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/record-staging-version.mjs
      - name: Upload inactive staging candidate
        id: candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/upload-staging-candidate.mjs
      - name: Smoke-test inactive staging candidate
        env:
          SMOKE_ORIGIN: ${{ steps.candidate.outputs.preview_url }}
        run: npm run smoke:staging
      - name: Promote verified staging candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CANDIDATE_VERSION_ID: ${{ steps.candidate.outputs.version_id }}
          PREVIOUS_VERSION_ID: ${{ steps.previous.outputs.version_id }}
        run: node scripts/promote-staging-candidate.mjs
      - name: Smoke-test promoted staging
        env:
          SMOKE_ORIGIN: ${{ steps.candidate.outputs.staging_url }}
        run: npm run smoke:staging
