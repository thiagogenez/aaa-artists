name: Deploy production

on:
  workflow_call:

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://aaaartists.co
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify deployment configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing production CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing production CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" || { echo "::error::Missing production NEXT_PUBLIC_TURNSTILE_SITE_KEY"; exit 1; }
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate artist and event data
        run: npm run check
      - name: Build production export
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build:production
      - name: Validate Cloudflare deployment bundle
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run check:deploy
      - name: Verify Cloudflare access and production domains
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run check:cloudflare-access
      - name: Record current production version
        id: previous
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          deployment="$(npm exec -- wrangler deployments status --name aaa-artists --json)"
          version_id="$(jq -r '.versions[] | select(.percentage == 100) | .version_id // empty' <<<"$deployment")"
          [[ "$version_id" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::Could not identify the current 100% production version"; exit 1; }
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
      - name: Upload inactive release candidate
        id: candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          deployment_tag="github-${GITHUB_SHA:0:12}"
          export WRANGLER_OUTPUT_FILE_PATH="${RUNNER_TEMP}/wrangler-upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl"
          npm exec -- wrangler versions upload --strict --tag "$deployment_tag" --message "GitHub Actions ${GITHUB_SHA}"
          upload="$(jq -cs '[.[] | select(.type == "version-upload")] | last' "$WRANGLER_OUTPUT_FILE_PATH")"
          version_id="$(jq -r '.version_id // empty' <<<"$upload")"
          preview_url="$(jq -r '.preview_url // empty' <<<"$upload")"
          [[ "$version_id" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::Could not identify the uploaded release candidate"; exit 1; }
          # The preview URL must be version-prefixed (https://<8-hex-version>-<worker>.<subdomain>.workers.dev)
          # so the smoke test exercises this exact inactive candidate — never a stable
          # alias or the workers.dev root, which could point at a different version.
          if [[ ! "$preview_url" =~ ^https://[0-9a-f]{8}-[a-z0-9-]+\.[^/]+\.workers\.dev/?$ ]]; then
            echo "::error::Candidate ${version_id} uploaded, but Wrangler returned no version-prefixed Preview URL (got: '${preview_url:-<empty>}')."
            echo "::error::Version Preview URLs must be enabled on the aaa-artists Worker so the exact inactive candidate can be smoke-tested before promotion. wrangler.jsonc sets \"preview_urls\": true, but \`wrangler versions upload\` only reads this — enable Preview URLs once on the Worker (Cloudflare dashboard, or a one-time \`npx wrangler triggers deploy\`). See docs/deployment.md. Not promoting."
            exit 1
          fi
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
      - name: Smoke-test inactive release candidate
        env:
          SMOKE_ORIGIN: ${{ steps.candidate.outputs.preview_url }}
        run: npm run smoke:production
      - name: Promote verified release candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CANDIDATE_VERSION_ID: ${{ steps.candidate.outputs.version_id }}
          PREVIOUS_VERSION_ID: ${{ steps.previous.outputs.version_id }}
        run: |
          set +e
          npm exec -- wrangler versions deploy "${CANDIDATE_VERSION_ID}@100" --yes --message "GitHub Actions ${GITHUB_SHA}"
          promotion_exit=$?
          set -e

          if [[ "$promotion_exit" -eq 0 ]]; then
            exit 0
          fi

          echo "::warning::Wrangler reported a promotion error; reconciling Cloudflare's active deployment state"
          for delay in 0 2 4 8 12; do
            if [[ "$delay" -gt 0 ]]; then sleep "$delay"; fi
            if deployment="$(npm exec -- wrangler deployments status --name aaa-artists --json)"; then
              active_version_id="$(jq -r '.versions[] | select(.percentage == 100) | .version_id // empty' <<<"$deployment")"
              if [[ "$active_version_id" == "$CANDIDATE_VERSION_ID" ]]; then
                echo "::warning::Cloudflare confirms the candidate was promoted; treating the release as successful"
                exit 0
              fi
              if [[ "$active_version_id" == "$PREVIOUS_VERSION_ID" ]]; then
                echo "::error::Promotion failed and production remains on the previous version"
                exit "$promotion_exit"
              fi
            fi
          done

          echo "::error::Promotion result is unknown after repeated Cloudflare status checks; inspect the deployment before retrying"
          exit "$promotion_exit"
