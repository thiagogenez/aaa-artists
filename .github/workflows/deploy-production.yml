name: Deploy production

# Production is released only from this workflow: manually dispatched from main,
# or called by the scheduled event refresh when main is already the commit live
# in production. The checks suite re-runs first, so a production release can
# never outrun a red pipeline. The deploy itself is transactional: preflight,
# upload an inactive commit-tagged candidate, smoke-test that exact version on
# its preview URL, and promote it to 100% traffic only as the final action.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  deployments: write

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.DEPLOYMENT_AUTHORITY == 'github'
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Job-level so a manual dispatch and the scheduled refresh can never touch
    # the production Worker concurrently (workflow-level concurrency is ignored
    # in called reusable workflows).
    concurrency:
      group: production-worker-deployment
      cancel-in-progress: false
    environment:
      name: production
      url: https://aaaartists.co
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify deployment configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing production CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing production CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" || { echo "::error::Missing production NEXT_PUBLIC_TURNSTILE_SITE_KEY"; exit 1; }
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate artist and event data
        run: npm run check
      - name: Build production export
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build:production
      - name: Validate Cloudflare deployment bundle
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run check:deploy
      - name: Verify Cloudflare access and production domains
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run check:cloudflare-access
      - name: Record current production version
        id: previous
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/record-production-version.mjs
      - name: Upload inactive release candidate
        id: candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/upload-production-candidate.mjs
      - name: Smoke-test inactive release candidate
        env:
          SMOKE_ORIGIN: ${{ steps.candidate.outputs.preview_url }}
        run: npm run smoke:production
      - name: Promote verified release candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CANDIDATE_VERSION_ID: ${{ steps.candidate.outputs.version_id }}
          PREVIOUS_VERSION_ID: ${{ steps.previous.outputs.version_id }}
        run: node scripts/promote-production-candidate.mjs
      # No canonical-domain smoke test here: Cloudflare's zone bot protection
      # returns 403 to GitHub-runner IPs, so it would mark successful releases
      # red. The promoted bytes were already smoke-tested on the candidate
      # preview URL, and the preflight verified both domains target the Worker.
      # Run `npm run smoke:production` locally after a release.
