name: Commit style

# Conventional Commits, checked on pull requests only.
#
# This deliberately does NOT exist as a local husky `commit-msg` hook: commits here are
# signed from the maintainer's own terminal, and a hook in that path risks breaking the
# one place where signing works. CI is the enforcement point instead.
#
# The pull request title is checked because squash-merging uses it as the commit
# message on main. Intermediate commits remain free to support local iteration.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          printf '%s' "$PR_TITLE" |
          npx --no-install commitlint
          --verbose

  description-standard:
    # Human pull requests carry the complete project record. Dependabot has no issue to
    # reference, but still has to show the dependency state before and after its update.
    # See the shared workflow in AGENTS.md and CONTRIBUTING.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Require an issue reference and the mandatory sections
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/validate-pr-body.mjs
