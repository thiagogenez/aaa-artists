name: CI

# Pull requests run the checks suite only. Pushes to main additionally deploy
# STAGING (workers.dev). Production is never deployed from here — it is released
# only by the manually dispatched "Deploy production" workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  deploy-staging:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOYMENT_AUTHORITY == 'github'
    needs: [checks]
    permissions:
      contents: read
      deployments: write
    secrets: inherit
    uses: ./.github/workflows/deploy-staging.yml
