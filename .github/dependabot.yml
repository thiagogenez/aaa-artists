version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Keep compile-time Node APIs aligned with the declared LTS runtime.
      # Node major upgrades are coordinated through .node-version, CI, and Cloudflare.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # Upgrade these majors only with a compatible Next.js toolchain release.
      - dependency-name: eslint
        update-types:
          - "version-update:semver-major"
      - dependency-name: typescript
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
